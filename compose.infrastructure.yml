services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manwall}
      POSTGRES_USER: ${POSTGRES_USER:-manwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manwall-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manwall} -d ${POSTGRES_DB:-manwall}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - manwall-postgres:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-manwall}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-manwall-local-only}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - manwall-minio:/data

  create-evidence-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        ${S3_ACCESS_KEY_ID:-manwall}
        ${S3_SECRET_ACCESS_KEY:-manwall-local-only}
        && mc mb --ignore-existing local/${S3_BUCKET:-manwall-evidence}

volumes:
  manwall-postgres:
  manwall-minio:
